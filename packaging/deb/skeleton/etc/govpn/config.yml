# Configuração do govpn-client.
# Preencha server e authkey (gerados no painel admin do govpn-server,
# em /admin) e depois rode:
#   sudo systemctl start govpn-client
#
# Depois do primeiro registro bem-sucedido, o dispositivo fica
# identificado pela chave salva em /var/lib/govpn/state.json — você
# pode deixar authkey em branco nas próximas vezes (ela só é usada uma
# vez, no primeiro registro).
#
# O servidor fala HTTPS por padrão (com certificado autoassinado, a
# menos que o administrador tenha configurado um de verdade). Se for
# esse o caso, descomente insecure_tls abaixo — isso ainda criptografa
# a conexão, só não valida a identidade do servidor contra uma CA.

server: "https://SEU_SERVIDOR:8443"
authkey: "SUA_AUTH_KEY"
hostname: ""
iface: "govpn0"
poll_interval: "10s"
# insecure_tls: true
