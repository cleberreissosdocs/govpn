server {
    if ($host = govpn.sosdocs.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name govpn.sosdocs.com.br;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/govpn.sosdocs.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/govpn.sosdocs.com.br/privkey.pem; # managed by Certbot

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log error;

    server_name govpn.sosdocs.com.br;

    location / {
        proxy_pass http://192.168.137.21:28443;
        proxy_http_version 1.1;

        # /api/relay faz um "upgrade" de conexao (tipo WebSocket) que
        # fica aberta por muito tempo -- sem isso o nginx derruba a
        # conexao do relay periodicamente.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
