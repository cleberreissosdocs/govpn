services:
  govpn-server:
    build: .
    image: govpn-server:latest
    container_name: govpn-server
    restart: unless-stopped
    ports:
      - "28443:28443"
    volumes:
      # tudo que precisa sobreviver a um restart/recriação do container
      # (banco de dados + backups feitos pelo painel admin) vive aqui.
      - ./data:/data
    command:
      - serve
      - --db=/data/govpn.db
      - --addr=:28443
      - --admin-user=admin
      - --admin-pass=TROQUE_ESTA_SENHA
      - --online-threshold=30s
